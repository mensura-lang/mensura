[workspace]
resolver = "2"
members = [
    "crates/mensura-syntax",
    "crates/mensura-types",
    "crates/mensura-runtime",
    "crates/mensura-highlight",
    "crates/mensura-lsp",
    "crates/mensura-mdbook",
    "crates/mensura-serve",
    "crates/mensura-deploy",
    "crates/mensura-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mensura-lang/mensura"

[workspace.dependencies]
mensura-syntax = { path = "crates/mensura-syntax", version = "0.0.0" }
mensura-types = { path = "crates/mensura-types", version = "0.0.0" }
mensura-runtime = { path = "crates/mensura-runtime", version = "0.0.0" }
mensura-highlight = { path = "crates/mensura-highlight", version = "0.0.0" }
mensura-lsp = { path = "crates/mensura-lsp", version = "0.0.0" }
mensura-serve = { path = "crates/mensura-serve", version = "0.0.0" }
mensura-deploy = { path = "crates/mensura-deploy", version = "0.0.0" }
unicode-xid = "0.2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled"] }
lsp-server = "0.10"
lsp-types = "0.97"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tower = { version = "0.5", features = ["util"] }
