name: Image

# Publishes the toolchain image a deployment runs `mensura serve` from
# (ADR 0046 decision 4): ghcr.io/mensura-lang/mensura, tagged `main` and
# `sha-<short commit>` on every push to main.  A pull request that touches
# the image's build only builds it, and checks that the binary runs.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mensura-lang/mensura
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm ghcr.io/mensura-lang/mensura:main --version
      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        run: docker push --all-tags ghcr.io/mensura-lang/mensura
