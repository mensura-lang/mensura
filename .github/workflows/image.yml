name: Image

# Publishes the toolchain image a deployment runs `mensura serve` from
# (ADR 0046 decision 4), ghcr.io/mensura-lang/mensura, under two kinds of
# tag:
#
# - `<version>` on a `v<version>` tag, which must match the workspace
#   version.  This is what a lasting deployment pins.
# - `main`, a moving tag, on a push to main that changes what the image is
#   built from.  Superseded `main` images stay as untagged versions, of
#   which the newest few are kept.
#
# A pull request that touches the image's build only builds it, and checks
# that the binary runs.

on:
  push:
    branches: [main]
    tags: ['v*']
    # Not evaluated for tag pushes, so a version tag always builds.
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/mensura-lang/mensura

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag against the workspace version
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mensura-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          # One manifest per image, with no untagged attestation beside
          # it for the pruning step to remove.
          provenance: false
          tags: |
            mensura:smoke
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm mensura:smoke --version
      - name: Log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        run: docker push --all-tags "$IMAGE"
      - name: Prune superseded main images
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: actions/delete-package-versions@v5
        with:
          package-name: mensura
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 10
