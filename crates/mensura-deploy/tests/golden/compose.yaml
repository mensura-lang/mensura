# Generated by `mensura deploy` from deploy.toml; edit that file
# and regenerate rather than editing this one.

name: "mensura-fleet"

services:
  mensura:
    image: "ghcr.io/mensura-lang/mensura:sha-1a2b3c4"
    command: ["serve", "--config", "/etc/mensura/mensura.toml"]
    labels:
      io.mensura.mounted-sha256: "0123abcd"
    environment:
      MENSURA_DATABASE_URL: "sqlite:/var/lib/mensura/fleet.db"
    volumes:
      - type: bind
        source: ./mensura
        target: /etc/mensura
        read_only: true
      - type: volume
        source: data
        target: /var/lib/mensura
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: "256M"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mensura", "health", "127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  bare:
    image: "ghcr.io/mensura-lang/mensura:sha-1a2b3c4"
    command: ["serve", "--config", "/etc/mensura/bare.toml"]
    environment:
      MENSURA_DATABASE_URL: "sqlite:/var/lib/mensura/fleet.db"
    volumes:
      - type: bind
        source: ./mensura
        target: /etc/mensura
        read_only: true
      - type: volume
        source: data
        target: /var/lib/mensura
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mensura", "health", "127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  data: {}
